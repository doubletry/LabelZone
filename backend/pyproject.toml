[project]
name = "labelzone-backend"
version = "0.1.0"
description = "LabelZone private annotation platform backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.136.1",
  "uvicorn==0.46.0",
  "pydantic-settings==2.14.1"
]

[project.optional-dependencies]
test = [
  "pytest==9.0.3",
  "httpx==0.28.1"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
