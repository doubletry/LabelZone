services:
  rustfs:
    image: ${RUSTFS_IMAGE:?set RUSTFS_IMAGE to a pinned RustFS image tag}
    environment:
      # Set these in your shell or .env file before deployment; do not commit production credentials.
      RUSTFS_ACCESS_KEY: ${LABELZONE_RUSTFS_ACCESS_KEY:?set LABELZONE_RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${LABELZONE_RUSTFS_SECRET_KEY:?set LABELZONE_RUSTFS_SECRET_KEY}
    volumes:
      - rustfs-data:/data
    ports:
      - "9000:9000"

  backend:
    environment:
      LABELZONE_STORAGE_BACKEND: rustfs
      LABELZONE_RUSTFS_ENDPOINT: http://rustfs:9000
      LABELZONE_RUSTFS_BUCKET: ${LABELZONE_RUSTFS_BUCKET:-labelzone}
      LABELZONE_RUSTFS_ACCESS_KEY: ${LABELZONE_RUSTFS_ACCESS_KEY:?set LABELZONE_RUSTFS_ACCESS_KEY}
      LABELZONE_RUSTFS_SECRET_KEY: ${LABELZONE_RUSTFS_SECRET_KEY:?set LABELZONE_RUSTFS_SECRET_KEY}
      LABELZONE_RUSTFS_SECURE: "false"
    depends_on:
      - rustfs

volumes:
  rustfs-data:
