services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      LABELZONE_DEFAULT_LOCALE: zh-CN
      LABELZONE_LOCAL_STORAGE_ROOT: /data
      LABELZONE_STORAGE_BACKEND: local
    volumes:
      - labelzone-data:/data
    ports:
      - "8000:8000"

  frontend:
    image: node:24-slim
    working_dir: /app/frontend
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    volumes:
      - .:/app
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  labelzone-data:
